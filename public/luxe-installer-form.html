<!-- LUXE Installer Match form — paste this whole block into a WordPress Custom HTML block or a Shopify page (Show HTML). Set data-source per site. -->
<div id="luxe-il" data-endpoint="https://LEAD_ROUTER_HOST/api/installer-lead" data-source="wordpress">
<style>
#luxe-il{--g:#F2B705;--k:#111;--bg:#f4f4f4;--bd:#d9d9d9;font-family:Poppins,Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--k);padding:32px 28px;border-radius:12px;max-width:720px;margin:0 auto;box-sizing:border-box}
#luxe-il *{box-sizing:border-box}
#luxe-il h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.01em}
#luxe-il .sub{margin:0 0 22px;color:#444;font-size:15px}
#luxe-il .row{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:14px}
#luxe-il .row.one{grid-template-columns:1fr}
#luxe-il label{display:block;font-size:13px;color:#333;margin-bottom:5px}
#luxe-il label b{color:#c00;font-weight:600}
#luxe-il input,#luxe-il select,#luxe-il textarea{width:100%;height:46px;border:1px solid var(--bd);border-radius:6px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:var(--k)}
#luxe-il textarea{height:84px;padding:10px 12px;resize:vertical}
#luxe-il input:focus,#luxe-il select:focus,#luxe-il textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
#luxe-il .consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;margin:6px 0 18px}
#luxe-il .consent input{width:18px;height:18px;margin-top:2px;flex:none}
#luxe-il button{background:var(--k);color:#fff;border:0;border-radius:6px;height:50px;padding:0 34px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:background .15s}
#luxe-il button:hover{background:var(--g);color:var(--k)}
#luxe-il button[disabled]{opacity:.6;cursor:wait}
#luxe-il .near{margin:-4px 0 14px;font-size:13px;color:#555;min-height:18px}
#luxe-il .near b{color:var(--k)}
#luxe-il .err{color:#c00;font-size:13px;margin-top:8px;display:none}
#luxe-il .done{display:none;padding:8px 0}
#luxe-il .done h3{margin:0 0 8px;font-size:22px}
#luxe-il .done ul{padding-left:18px;margin:8px 0 14px}
#luxe-il .done li{margin:4px 0}
#luxe-il .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
#luxe-il .fine{font-size:12px;color:#666;margin-top:14px}
@media(max-width:600px){#luxe-il{padding:24px 18px}#luxe-il .row{grid-template-columns:1fr}#luxe-il h2{font-size:24px}#luxe-il button{width:100%}}
</style>
<form id="luxe-il-form" novalidate>
  <h2>Get Matched With a LUXE Installer</h2>
  <p class="sub">Free, no-obligation quote from a certified LUXE Protection Films installer near you.</p>
  <div class="row">
    <div><label>First name <b>*</b></label><input name="firstName" autocomplete="given-name" required></div>
    <div><label>Last name <b>*</b></label><input name="lastName" autocomplete="family-name" required></div>
  </div>
  <div class="row">
    <div><label>Email <b>*</b></label><input name="email" type="email" autocomplete="email" required></div>
    <div><label>Phone <b>*</b></label><input name="phone" type="tel" autocomplete="tel" required></div>
  </div>
  <div class="row">
    <div><label>Zip code <b>*</b></label><input name="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" required></div>
    <div><label>State <b>*</b></label><select name="state" required><option value="">Choose one</option></select></div>
  </div>
  <div class="near" id="luxe-il-near"></div>
  <div class="row">
    <div><label>Vehicle make &amp; model <b>*</b></label><input name="vehicle" placeholder="e.g. Porsche 911 GT3" required></div>
    <div><label>Vehicle year <b>*</b></label><select name="vehicleYear" required><option value="">Choose one</option></select></div>
  </div>
  <div class="row one">
    <div><label>Which LUXE film are you interested in? <b>*</b></label>
      <select name="product" required>
        <option value="">Choose one</option>
        <option>Gloss Is Boss</option>
        <option>Stealth Matte</option>
        <option>Color Series PPF</option>
        <option>Windshield Guard</option>
        <option>Not sure yet</option>
      </select></div>
  </div>
  <div class="row one">
    <div><label>Anything else about your project?</label><textarea name="message" placeholder="Coverage wanted (full front, full body, track pack), timing, color ideas…"></textarea></div>
  </div>
  <input class="hp" name="website2" tabindex="-1" autocomplete="off">
  <label class="consent"><input type="checkbox" name="consent" required><span>I consent to LUXE Protection Films sharing my information with a certified LUXE installer in my area so they can contact me about a free estimate. <b>*</b></span></label>
  <button type="submit">Get My Free Quote</button>
  <div class="err" id="luxe-il-err"></div>
  <p class="fine">LUXE films carry a 10-year manufacturer warranty when installed by a certified installer and registered. Prefer to browse? <a href="https://luxeprotectionfilms.com/installer-locator/">See all LUXE installers</a>.</p>
</form>
<div class="done" id="luxe-il-done"></div>
<script>
(function(){
  var root=document.getElementById('luxe-il'),f=document.getElementById('luxe-il-form'),ep=root.dataset.endpoint,src=root.dataset.source||'web';
  var states='AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');
  var st=f.state;states.forEach(function(s){var o=document.createElement('option');o.textContent=s;st.appendChild(o)});
  var yr=f.vehicleYear,now=new Date().getFullYear()+1;for(var y=now;y>=1990;y--){var o=document.createElement('option');o.textContent=y;yr.appendChild(o)}
  var near=document.getElementById('luxe-il-near'),t;
  f.zip.addEventListener('input',function(){clearTimeout(t);var z=f.zip.value.trim();near.textContent='';if(!/^\d{5}/.test(z))return;
    t=setTimeout(function(){fetch(ep.replace('/installer-lead','/installers/nearest')+'?zip='+encodeURIComponent(z.slice(0,5))).then(function(r){return r.json()}).then(function(d){
      if(d.location&&d.location.state&&!st.value)st.value=d.location.state;
      if(d.nearest&&d.nearest.length){var n=d.nearest[0];near.innerHTML='Nearest LUXE installer: <b>'+n.name+'</b> — '+n.city+', '+n.state+' ('+n.distanceMi+' mi)'+(d.covered?'':' · we\'ll also review options for your area');}
    }).catch(function(){})},400)});
  f.addEventListener('submit',function(e){e.preventDefault();var err=document.getElementById('luxe-il-err');err.style.display='none';
    if(!f.checkValidity()){err.textContent='Please complete all required fields.';err.style.display='block';f.reportValidity();return;}
    var b=f.querySelector('button');b.disabled=true;b.textContent='Sending…';
    var data={};new FormData(f).forEach(function(v,k){data[k]=v});data.consent=f.consent.checked;data.source=src;data.country='US';
    fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(r){
      if(!r.ok)throw new Error(r.error||'error');
      var d=document.getElementById('luxe-il-done'),list=(r.nearest||[]).map(function(n){return '<li><b>'+n.name+'</b> — '+[n.address,n.city,n.state].filter(Boolean).join(', ')+(n.phone?' · '+n.phone:'')+(n.distanceMi!=null?' · '+n.distanceMi+' mi':'')+'</li>'}).join('');
      d.innerHTML='<h3>You\'re in. '+(r.assigned?'<span style="font-weight:400">We\'ve sent your request to <b>'+r.assigned+'</b>.</span>':'<span style="font-weight:400">Our team is matching you with the right installer.</span>')+'</h3><p>Expect a call or email shortly. A confirmation is on its way to your inbox.</p>'+(list?'<p>Nearest LUXE installers:</p><ul>'+list+'</ul>':'')+'<p><a href="https://luxeprotectionfilms.com/installer-locator/">Browse all LUXE installers →</a></p>';
      f.style.display='none';d.style.display='block';root.scrollIntoView({behavior:'smooth',block:'start'});
      try{window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'luxe_installer_lead',priority:r.priority,covered:r.covered,source:src});}catch(_){}
    }).catch(function(){err.textContent='Something went wrong. Please try again or call (510) 366-7351.';err.style.display='block';b.disabled=false;b.textContent='Get My Free Quote';});
  });
})();
</script>
</div>
